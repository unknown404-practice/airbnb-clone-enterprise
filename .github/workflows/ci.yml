name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client-verification:
    name: Client Build & Asset Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Client Dependencies
        run: npm install

      - name: Build Vite Production Assets
        run: npm run build

  server-verification:
    name: Server API Verification & Shadow Run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Server Dependencies
        run: npm install

      - name: Execute Server Test Suite
        run: npm test
        env:
          NODE_ENV: test
          PORT: 5000
          JWT_SECRET: super_secret_airbnb_clone_jwt_token_key_2026!
