version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: airbnb-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - airbnb-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: airbnb-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/airbnb
      - JWT_SECRET=super_secret_airbnb_clone_jwt_token_key_2026!
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongo
    networks:
      - airbnb-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: airbnb-client
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - server
    networks:
      - airbnb-network

volumes:
  mongo-data:

networks:
  airbnb-network:
    driver: bridge
